<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation History - Fuel Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Calculation History</h1>
        <p>Your past fuel consumption records</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Calculate</a></li>
            <li class="active"><a href="history.html">History</a></li>
            <li><a href="stats.html">Stats</a></li>
        </ul>
    </nav>

    <main>
        <section id="history-section">
            <h2>History Log</h2>
            <div id="history-list">
                <!-- Stored history will be loaded here by fuel.js -->
                <p>Loading history...</p>
            </div>

            <button type="button" id="reset" onclick="clearHistory()"

                Clear All History
            </button>
        </section>
    </main>

    <footer>
